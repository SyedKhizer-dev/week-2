AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Serverless calculator API deployed using AWS SAM

Resources:
  CalculatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: calculator-api
      Runtime: python3.13
      Handler: app.handler.lambda_handler
      CodeUri: .
      MemorySize: 128
      Timeout: 10
      Events:
        CalculatorApi:
          Type: HttpApi
          Properties:
            Path: /calculate
            Method: GET

Outputs:
  CalculatorApiUrl:
    Description: URL of the calculator API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/calculate"